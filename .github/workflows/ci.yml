name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CI: true
      NODE_ENV: test
      PORT: 5000
      JWT_ACCESS_SECRET: ci-test-only-access-token-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-test-only-refresh-token-secret-min-32-chars-long
      FRONTEND_URL: http://localhost:5173
      RESET_TOKEN_EXPIRE_MINUTES: 15
      ACCOUNT_LOCKOUT_MINUTES: 15
      MONGO_URI: mongodb://localhost:27017/auth_test_db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend (React & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      CI: true
      VITE_API_URL: http://localhost:5000/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build
